schema_version = "1.4"

[task]
name = "matthewalberto/shell-escape-guard-inline-scripts"
version = "1.0.0"
description = "Extend a Claude Code PreToolUse hook so it blocks mangled backslash escapes in python -c, node -e and sed arguments, not only in heredocs, without blocking ordinary commands."
authors = [{ name = "Matthew Alberto" }]
keywords = ["python", "shell", "regex", "parsing", "claude-code-hooks"]

[metadata]
difficulty = "medium"
category = "software-engineering"
tags = ["shell-quoting", "false-positives", "security-guard"]
difficulty_explanation = "The block half is easy. The work is in the allow half: quoted-string scanning that honours escaped quotes, flags between the interpreter and -c, and a scan that stops at the end of its own command."
source = "Real change in github.com/matthewalberto/claude-code-guardrails (hooks/guard_heredoc_escapes.py), MIT licensed."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
network_mode = "no-network"
